<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selenium Java ➔ Playwright TS Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-bg: rgba(17, 24, 39, 0.75);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-indigo: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 32px;
      background: rgba(11, 15, 25, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-cyan));
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: white;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }

    .brand h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-dot.online {
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    select.model-select {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border-color);
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    main {
      flex: 1;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .sample-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-cyan));
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      flex: 1;
      min-height: 520px;
    }

    .editor-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-header {
      padding: 12px 18px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .editor-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-pill {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }

    .editor-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      color: white;
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-color);
    }

    textarea.code-area {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-family: 'Fira Code', monospace;
      font-size: 13.5px;
      line-height: 1.6;
      padding: 16px;
      resize: none;
      outline: none;
    }

    textarea.code-area::placeholder {
      color: #475569;
    }

    .output-area {
      flex: 1;
      width: 100%;
      background: rgba(15, 23, 42, 0.5);
      color: #38bdf8;
      font-family: 'Fira Code', monospace;
      font-size: 13.5px;
      line-height: 1.6;
      padding: 16px;
      overflow-y: auto;
      white-space: pre-wrap;
      user-select: text;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      padding: 14px 32px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-badge">⚡</div>
      <h1>Selenium ➔ Playwright Converter</h1>
    </div>
    <div class="header-actions">
      <div class="status-badge">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Checking Ollama...</span>
      </div>
      <select id="modelSelect" class="model-select">
        <option value="codellama:latest">codellama:latest</option>
      </select>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="sample-buttons">
        <button class="btn-secondary" onclick="loadSamplePOM()">📄 Load Sample Page Object (POM)</button>
        <button class="btn-secondary" onclick="loadSampleTest()">🧪 Load Sample TestNG Test</button>
        <button class="btn-secondary" onclick="clearInput()">🗑️ Clear</button>
      </div>

      <button id="convertBtn" class="btn-primary" onclick="convertCode()">
        <span id="btnIcon">🚀</span>
        <span id="btnText">Convert to Playwright TS</span>
      </button>
    </div>

    <div class="editor-grid">
      <!-- Input Panel -->
      <div class="editor-card">
        <div class="editor-header">
          <div class="editor-title">
            <span>Input Selenium Source</span>
            <span class="lang-pill">Java</span>
          </div>
        </div>
        <textarea id="javaInput" class="code-area" placeholder="// Paste your Selenium Java code here..."></textarea>
      </div>

      <!-- Output Panel -->
      <div class="editor-card">
        <div class="editor-header">
          <div class="editor-title">
            <span>Playwright Output</span>
            <span class="lang-pill">TypeScript</span>
          </div>
          <div class="editor-actions">
            <button class="icon-btn" onclick="copyOutput()">📋 Copy Code</button>
            <button class="icon-btn" onclick="downloadOutput()">💾 Download .ts</button>
          </div>
        </div>
        <pre id="tsOutput" class="output-area">// Converted Playwright TypeScript code will appear here...</pre>
      </div>
    </div>
  </main>

  <footer>
    Antigravity B.L.A.S.T. Protocol • Local Ollama LLM Converter • localhost:5000
  </footer>

  <script>
    const SAMPLE_POM = `package com.thetestingacademy.pages;

import org.openqa.selenium.By;
import org.openqa.selenium.WebDriver;

public class LoginPage {
    private WebDriver driver;

    // Locators
    private By usernameInput = By.id("login-username");
    private By passwordInput = By.id("login-password");
    private By submitButton = By.id("js-login-btn");
    private By errorMessage = By.id("js-notification-box-msg");

    public LoginPage(WebDriver driver) {
        this.driver = driver;
    }

    public void loginToVWO(String user, String pass) {
        driver.findElement(usernameInput).sendKeys(user);
        driver.findElement(passwordInput).sendKeys(pass);
        driver.findElement(submitButton).click();
    }

    public String getErrorMessage() {
        return driver.findElement(errorMessage).getText();
    }
}`;

    const SAMPLE_TEST = `package com.thetestingacademy.tests;

import org.testng.annotations.Test;
import org.testng.Assert;
import com.thetestingacademy.pages.LoginPage;

public class LoginTest {

    @Test
    public void testLoginFailure() {
        LoginPage loginPage = new LoginPage(driver);
        loginPage.openURL("https://app.vwo.com");
        loginPage.loginToVWO("admin@gmail.com", "wrongpass");
        String errorMsg = loginPage.getErrorMessage();
        Assert.assertEquals(errorMsg, "Your email, password, IP address or location did not match");
    }
}`;

    // On Load
    window.addEventListener('DOMContentLoaded', () => {
      checkOllamaStatus();
    });

    async function checkOllamaStatus() {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      const select = document.getElementById('modelSelect');

      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        if (data.ollamaUp) {
          dot.classList.add('online');
          text.textContent = 'Ollama Connected';

          if (data.models && data.models.length > 0) {
            select.innerHTML = '';
            data.models.forEach(m => {
              const opt = document.createElement('option');
              opt.value = m;
              opt.textContent = m;
              if (m === data.defaultModel) opt.selected = true;
              select.appendChild(opt);
            });
          }
        } else {
          text.textContent = 'Ollama Offline';
        }
      } catch (err) {
        text.textContent = 'Server Offline';
      }
    }

    function loadSamplePOM() {
      document.getElementById('javaInput').value = SAMPLE_POM;
    }

    function loadSampleTest() {
      document.getElementById('javaInput').value = SAMPLE_TEST;
    }

    function clearInput() {
      document.getElementById('javaInput').value = '';
      document.getElementById('tsOutput').textContent = '// Converted Playwright TypeScript code will appear here...';
    }

    async function convertCode() {
      const javaCode = document.getElementById('javaInput').value;
      const model = document.getElementById('modelSelect').value;
      const btn = document.getElementById('convertBtn');
      const icon = document.getElementById('btnIcon');
      const btnText = document.getElementById('btnText');
      const output = document.getElementById('tsOutput');

      if (!javaCode.trim()) {
        alert('Please paste or load Selenium Java code first!');
        return;
      }

      btn.disabled = true;
      icon.className = 'spinner';
      icon.textContent = '';
      btnText.textContent = 'Converting with Ollama...';
      output.textContent = '// ⏳ Conversion in progress via local LLM... Please wait.';

      try {
        const response = await fetch('/api/convert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ javaCode, model })
        });

        const data = await response.json();

        if (data.status === 'success') {
          output.textContent = data.tsCode;
        } else {
          output.textContent = `❌ Conversion Error:\n${data.message || 'Unknown error occurred'}`;
        }
      } catch (err) {
        output.textContent = `❌ Network Error connecting to converter backend: ${err.message}`;
      } finally {
        btn.disabled = false;
        icon.className = '';
        icon.textContent = '🚀';
        btnText.textContent = 'Convert to Playwright TS';
      }
    }

    function copyOutput() {
      const text = document.getElementById('tsOutput').textContent;
      navigator.clipboard.writeText(text);
      alert('Copied converted TypeScript code to clipboard!');
    }

    function downloadOutput() {
      const text = document.getElementById('tsOutput').textContent;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'converted_test.ts';
      a.click();
    }
  </script>
</body>
</html>
