<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bug Report Studio</title>
<style>
  :root {
    --bg:#f4f5fb; --panel:#fff; --ink:#1c2033; --muted:#6b7190; --line:#e5e7f2; --brand:#5b5bf0;
    --brand-ink:#fff; --bubble-u:#5b5bf0; --bubble-a:#eef0fb; --chip:#f0f1fa;
    --crit:#e5384f; --high:#f07b2e; --med:#e5a912; --low:#2fa86b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f111a; --panel:#181b28; --ink:#e8eaf6; --muted:#8f95b5; --line:#2a2e44;
            --bubble-a:#232740; --chip:#232740; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 24px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:18px; margin:0; }
  header .logo { width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#5b5bf0,#a24bf0);
                 display:grid; place-items:center; color:#fff; font-size:17px; }
  header .engine { margin-left:auto; font-size:12px; color:var(--muted); background:var(--chip); padding:4px 10px; border-radius:99px; }
  main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(320px,420px) 1fr; gap:16px; padding:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; display:flex; flex-direction:column; min-height:0; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:9px 13px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { align-self:flex-end; background:var(--bubble-u); color:var(--brand-ink); border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:var(--bubble-a); border-bottom-left-radius:4px; }
  .msg.typing { color:var(--muted); font-style:italic; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font:inherit;
             background:var(--bg); color:var(--ink); height:48px; }
  textarea:focus { outline:2px solid var(--brand); outline-offset:-1px; }
  button { font:inherit; border:0; border-radius:10px; padding:0 16px; cursor:pointer; background:var(--brand); color:var(--brand-ink); font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:var(--chip); color:var(--ink); height:34px; font-weight:500; font-size:13px; }
  .toolbar { display:flex; gap:8px; padding:12px 20px; border-bottom:1px solid var(--line); align-items:center; }
  .toolbar b { margin-right:auto; }
  #report { flex:1; overflow-y:auto; padding:24px 28px; }
  .empty { height:100%; display:grid; place-items:center; text-align:center; color:var(--muted); }
  .empty .big { font-size:42px; }
  .rid { color:var(--muted); font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
  .rtitle { font-size:24px; font-weight:700; margin:4px 0 14px; line-height:1.25; }
  .badges { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .badge { padding:3px 11px; border-radius:99px; font-size:12.5px; font-weight:600; background:var(--chip); }
  .badge.sev-Critical { background:var(--crit); color:#fff; } .badge.sev-High { background:var(--high); color:#fff; }
  .badge.sev-Medium { background:var(--med); color:#1c2033; } .badge.sev-Low { background:var(--low); color:#fff; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .box { border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .box h3, .sec h3 { margin:0 0 6px; font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  .box.exp { border-left:4px solid var(--low); } .box.act { border-left:4px solid var(--crit); }
  .sec { margin-bottom:20px; } .sec p { margin:0; white-space:pre-wrap; }
  ol { margin:0; padding-left:22px; } li { margin:3px 0; }
  .na { color:var(--muted); font-style:italic; }
  @media (max-width:820px) { main { grid-template-columns:1fr; overflow-y:auto; } .card { min-height:420px; } .grid { grid-template-columns:1fr; } }
  @media print { body { height:auto; } header, .card:first-child, .toolbar { display:none; } main { display:block; padding:0; } .card { border:0; } }
</style>
</head>
<body>
<header>
  <div class="logo">🐞</div><h1>Bug Report Studio</h1><span class="engine" id="engine">ready</span>
</header>
<main>
  <section class="card">
    <div id="log"></div>
    <form id="form">
      <textarea id="input" placeholder="Describe the bug… (Enter to send, Shift+Enter for newline)" autofocus></textarea>
      <button id="send">Send</button>
    </form>
  </section>
  <section class="card">
    <div class="toolbar">
      <b>Live report</b>
      <button class="ghost" id="copy">Copy Markdown</button>
      <button class="ghost" id="dl">Download HTML</button>
      <button class="ghost" id="print">Print / PDF</button>
      <button class="ghost" id="reset">New</button>
    </div>
    <div id="report"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GREETING = "Hi! Tell me about the bug in your own words — what you were doing, what went wrong, and where. I'll build the report as we talk.";
let messages = [], report = null, busy = false;

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role; d.textContent = text;
  $('log').appendChild(d); $('log').scrollTop = 1e9; return d;
}
function na(v) { return v ? esc(v) : '<span class="na">Not provided</span>'; }

function renderReport() {
  const r = report;
  if (!r || !(r.title || r.summary)) {
    $('report').innerHTML = '<div class="empty"><div><div class="big">📝</div><p>Your bug report will appear here<br>as you describe the issue in the chat.</p></div></div>';
    return;
  }
  const steps = r.steps.length ? '<ol>' + r.steps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol>' : '<span class="na">Not provided</span>';
  const badges = [r.severity && `<span class="badge sev-${esc(r.severity)}">Severity: ${esc(r.severity)}</span>`,
                  r.priority && `<span class="badge">Priority: ${esc(r.priority)}</span>`,
                  r.component && `<span class="badge">📦 ${esc(r.component)}</span>`,
                  r.environment && `<span class="badge">🖥 ${esc(r.environment)}</span>`].filter(Boolean).join('');
  $('report').innerHTML = `
    <div class="rid">Bug Report · ${esc(r.generated || '')}</div>
    <div class="rtitle">${esc(r.title || 'Untitled bug')}</div>
    <div class="badges">${badges}</div>
    <div class="sec"><h3>Summary</h3><p>${na(r.summary)}</p></div>
    <div class="sec"><h3>Steps to reproduce</h3>${steps}</div>
    <div class="grid">
      <div class="box exp"><h3>Expected</h3><p>${na(r.expected)}</p></div>
      <div class="box act"><h3>Actual</h3><p>${na(r.actual)}</p></div>
    </div>
    <div class="sec"><h3>Workaround</h3><p>${na(r.workaround)}</p></div>
    ${r.notes ? `<div class="sec"><h3>Additional notes</h3><p>${esc(r.notes)}</p></div>` : ''}`;
}

function toMarkdown(r) {
  const v = x => x || '_Not provided_';
  return `# ${r.title || 'Untitled bug'}\n\n**Severity:** ${v(r.severity)} | **Priority:** ${v(r.priority)}\n**Component:** ${v(r.component)}\n**Environment:** ${v(r.environment)}\n\n## Summary\n${v(r.summary)}\n\n## Steps to Reproduce\n${r.steps.length ? r.steps.map((s,i) => `${i+1}. ${s}`).join('\n') : '_Not provided_'}\n\n## Expected\n${v(r.expected)}\n\n## Actual\n${v(r.actual)}\n\n## Workaround\n${v(r.workaround)}\n${r.notes ? `\n## Notes\n${r.notes}\n` : ''}`;
}

async function send(text) {
  busy = true; $('send').disabled = true;
  messages.push({role:'user', content:text}); addMsg('user', text);
  const t = addMsg('bot typing', 'Writing report…');
  try {
    const res = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'},
                                          body: JSON.stringify({messages, report})});
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    t.className = 'msg bot'; t.textContent = data.reply;
    messages.push({role:'assistant', content:data.reply});
    report = data.report; $('engine').textContent = data.engine; renderReport();
  } catch (e) { t.className = 'msg bot'; t.textContent = 'Something went wrong. Please try again.'; messages.pop(); }
  busy = false; $('send').disabled = false; $('input').focus();
}

function reset() { messages = []; report = null; $('log').innerHTML = ''; addMsg('bot', GREETING); renderReport(); }

$('form').addEventListener('submit', e => { e.preventDefault(); const t = $('input').value.trim(); if (!t || busy) return; $('input').value = ''; send(t); });
$('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } });
$('reset').onclick = reset;
$('print').onclick = () => window.print();
$('copy').onclick = async () => { if (!report) return; await navigator.clipboard.writeText(toMarkdown(report)); $('copy').textContent = 'Copied ✓'; setTimeout(() => $('copy').textContent = 'Copy Markdown', 1500); };
$('dl').onclick = () => {
  if (!report) return;
  const css = [...document.styleSheets[0].cssRules].map(r => r.cssText).join('\n');
  const html = `<!doctype html><meta charset="utf-8"><title>${esc(report.title)}</title><style>${css} body{height:auto;display:block;padding:32px;max-width:860px;margin:auto}</style>${$('report').innerHTML}`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], {type:'text/html'}));
  a.download = 'bug-report.html'; a.click();
};
reset();
</script>
</body>
</html>
